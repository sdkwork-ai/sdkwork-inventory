# Generated by the SDKWork web server standard (SDKWORK_WEBSERVER_SPEC.md)
# from server.common.toml + server.cloud.toml; do not edit by hand.
user sdkwork;
worker_processes auto;
pid /run/sdkwork/inventory/webserver.pid;
error_log /var/log/sdkwork/inventory/webserver/error.log warn;
events {
    worker_connections 1024;
}
http {
    sendfile on;
    keepalive_timeout 75;
    client_max_body_size 1100m;
    server_tokens off;
    gzip on;
    upstream gateway {
        least_conn;
        keepalive 32;
        server sdkwork-api-cloud-gateway:8080;
    }
    server {
        listen 80;
        server_name inventory-demo.sdkwork.com inventory-demo.birdcoder.com inventory-demo.dtupay.com inventory-demo.noaper.com inventory-demo.sdkwork.cn inventory-demo.birdcoder.cn inventory-demo.dtupay.cn inventory-demo.noaper.cn inventory-demo.skubc.com inventory-demo.skubc.cn inventory-demo.zowalk.com inventory-demo.zowalk.cn inventory-demo.offer86.com inventory-demo.offer86.cn inventory-demo.86offer.com inventory-demo.86offer.cn;
        include snippets/gateway-api-locations.nonproduction.conf;
        location / {
            root /usr/share/sdkwork/inventory/web/static;
            index index.html;
            try_files $uri $uri/ =404;
        }
    }
}

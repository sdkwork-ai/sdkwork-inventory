# Generated by the SDKWork web server standard (SDKWORK_WEBSERVER_SPEC.md)
# from server.common.toml + server.standalone.toml; do not edit by hand.
user sdkwork;
worker_processes auto;
pid /run/sdkwork/inventory/webserver.pid;
error_log /var/log/sdkwork/inventory/webserver/error.log warn;
events {
    worker_connections 1024;
}
http {
    sendfile on;
    keepalive_timeout 75;
    client_max_body_size 1100m;
    server_tokens off;
    gzip on;
    include snippets/adaptive-web.maps.conf;
    upstream gateway {
        least_conn;
        keepalive 32;
        server 127.0.0.1:3900;
    }
    server {
        listen 80;
        server_name inventory-dev.sdkwork.com inventory-dev.birdcoder.com inventory-dev.dtupay.com inventory-dev.sdkwork.cn inventory-dev.birdcoder.cn inventory-dev.dtupay.cn inventory-dev.skubc.com inventory-dev.skubc.cn inventory-dev.zowalk.com inventory-dev.zowalk.cn inventory-dev.offer86.com inventory-dev.offer86.cn inventory-dev.86offer.com inventory-dev.86offer.cn;
        include snippets/gateway-locations.nonproduction.conf;
    }
}
